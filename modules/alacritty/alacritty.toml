[font]
size = 10.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.normal]
black = "#000000"
red = "#dc3232"
green = "#32c832"
yellow = "#f0c832"
blue = "#3264dc"
magenta = "#c832c8"
cyan = "#32c8c8"
white = "#dcdcdc"

[colors.bright]
black = "#646464"
red = "#ff5a5a"
green = "#5aff5a"
yellow = "#ffff5a"
blue = "#5a8cff"
magenta = "#ff5aff"
cyan = "#5affff"
white = "#ffffff"

[keyboard]
bindings = [{ key = "V", mods = "Control", action = "Paste" }]
